<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#17251D" />

    <!--
      Default metadata (homepage values).
      Every route overrides these via the <Seo /> component, which renders
      through react-helmet-async. The `data-rh` attribute is that library's
      marker for replaceable tags: it lets routes swap these defaults out
      instead of ending up with two <meta name="description"> tags at once.
      They stay in the served HTML because WhatsApp, Facebook and other link
      scrapers never execute JavaScript.
    -->
    <title data-rh="true">Bandhan Events | Wedding Decorators &amp; Banquet in Mulund, Mumbai</title>
    <meta
      data-rh="true"
      name="description"
      content="Bandhan Events offers wedding decoration, event decor, banquet and catering services in Mulund West, Mumbai for weddings, celebrations, corporate events and special occasions."
    />
    <meta data-rh="true" property="og:site_name" content="Bandhan Events" />
    <meta
      data-rh="true"
      property="og:title"
      content="Bandhan Events | Wedding Decorators &amp; Banquet in Mulund, Mumbai"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="Bandhan Events offers wedding decoration, event decor, banquet and catering services in Mulund West, Mumbai for weddings, celebrations, corporate events and special occasions."
    />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:url" content="https://bandhanevents.in/" />
    <meta data-rh="true" property="og:image" content="https://bandhanevents.in/og-image.png" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta
      data-rh="true"
      property="og:image:alt"
      content="Bandhan Events — wedding decoration and banquet venue in Mulund West, Mumbai"
    />
    <meta data-rh="true" property="og:locale" content="en_IN" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta
      data-rh="true"
      name="twitter:title"
      content="Bandhan Events | Wedding Decorators &amp; Banquet in Mulund, Mumbai"
    />
    <meta
      data-rh="true"
      name="twitter:description"
      content="Bandhan Events offers wedding decoration, event decor, banquet and catering services in Mulund West, Mumbai for weddings, celebrations, corporate events and special occasions."
    />
    <meta data-rh="true" name="twitter:image" content="https://bandhanevents.in/og-image.png" />

    <!--
      Fonts: Cormorant Garamond (headings) + Manrope (body). Warm up the
      connection early and swap so text paints immediately. Two families only.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
