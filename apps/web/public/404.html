<!doctype html>
<!--
  GitHub Pages SPA fallback (spa-github-pages URL scheme).

  GitHub Pages serves this file for any path that has no real file behind it.
  The script rewrites the URL to `/<base>/?/<route>`; index.html then converts
  it back to a clean path before React Router mounts (see src/main.tsx), so
  deep links and refreshes work without a server.

  KEEP = leading path segments that form the site base:
    - project page (/bandhan-events/) → 1
    - custom domain (base "/")        → 0
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Bandhan Events</title>
    <script>
      var KEEP = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + KEEP).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(KEEP).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
