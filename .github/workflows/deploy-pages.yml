name: Deploy public site to GitHub Pages

# GitHub Pages hosts the static frontend only. The Express API runs elsewhere;
# set the repository variable VITE_API_BASE_URL to its URL when it exists
# (Settings → Secrets and variables → Actions → Variables).
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # npm ci against the lockfile. The Windows-generated lock was missing
        # @rollup/rollup-linux-x64-gnu (npm does not record other platforms'
        # optional native binaries — npm/cli#4828); the entry was added with
        # its registry integrity so cross-platform installs work.
        run: npm ci
      - name: Build site
        run: npm run build
        env:
          # Project page https://<user>.github.io/<repo>/ — use "/" instead if
          # the site later moves to a custom domain.
          VITE_BASE: /bandhan-events/
          # Optional: full base URL of the deployed API, e.g.
          # https://api.example.com/api/v1 — empty means same-origin /api/v1.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
